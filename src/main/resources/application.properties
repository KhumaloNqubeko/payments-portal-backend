spring.application.name=payments-portal-backend
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payments_portal}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
server.port=${SERVER_PORT:8080}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.jwt.secret=${JWT_SECRET:change-me-change-me-change-me-change-me-please}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}
app.security.require-https=${REQUIRE_HTTPS:false}
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEY_STORE:}
server.ssl.key-store-password=${SSL_KEY_STORE_PASSWORD:}
server.ssl.key-store-type=${SSL_KEY_STORE_TYPE:PKCS12}
server.error.include-message=never
server.error.include-binding-errors=never
logging.level.org.springframework.security=INFO
